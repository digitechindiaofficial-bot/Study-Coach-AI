openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: GovtGuru API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profiles
    description: User profile operations
  - name: study-plans
    description: AI study plan operations
  - name: daily-tasks
    description: Daily task operations
  - name: syllabus
    description: Syllabus progress tracking
  - name: current-affairs
    description: Current affairs articles
  - name: quiz
    description: Quiz questions and attempts
  - name: progress
    description: Progress analytics
  - name: ai
    description: AI generation endpoints

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profiles/me:
    get:
      operationId: getMyProfile
      tags: [profiles]
      summary: Get current user profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
    put:
      operationId: upsertProfile
      tags: [profiles]
      summary: Create or update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Profile upserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profiles/me/streak:
    post:
      operationId: updateStreak
      tags: [profiles]
      summary: Update streak after completing a task
      responses:
        "200":
          description: Streak updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /study-plans/current:
    get:
      operationId: getCurrentStudyPlan
      tags: [study-plans]
      summary: Get the user's current study plan
      responses:
        "200":
          description: Study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"
        "404":
          description: No plan found

  /study-plans/generate:
    post:
      operationId: generateStudyPlan
      tags: [study-plans]
      summary: Generate AI study plan using Gemini
      responses:
        "200":
          description: Generated study plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudyPlan"

  /daily-tasks:
    get:
      operationId: getDailyTasks
      tags: [daily-tasks]
      summary: Get daily tasks for a date
      parameters:
        - name: date
          in: query
          schema:
            type: string
          description: ISO date string (defaults to today)
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyTask"

  /daily-tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [daily-tasks]
      summary: Mark a task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Task completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTask"

  /syllabus:
    get:
      operationId: getSyllabus
      tags: [syllabus]
      summary: Get all exams with subjects, topics, and user progress
      responses:
        "200":
          description: Exams with progress
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyllabusExamWithProgress"

  /syllabus/topics/{topicId}:
    patch:
      operationId: updateTopicProgress
      tags: [syllabus]
      summary: Update user progress for a topic
      parameters:
        - name: topicId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicProgressUpdate"
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicProgressResult"

  /current-affairs:
    get:
      operationId: getCurrentAffairs
      tags: [current-affairs]
      summary: Get current affairs articles
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Articles list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CurrentAffairsArticle"

  /quiz/questions:
    get:
      operationId: getQuizQuestions
      tags: [quiz]
      summary: Get quiz questions
      parameters:
        - name: examCode
          in: query
          schema:
            type: string
        - name: subjectCode
          in: query
          schema:
            type: string
        - name: topicCode
          in: query
          schema:
            type: string
        - name: subject
          in: query
          schema:
            type: string
        - name: topic
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: weakOnly
          in: query
          schema:
            type: boolean
        - name: exclude
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Questions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizQuestion"

  /quiz/attempts:
    post:
      operationId: submitQuizAttempt
      tags: [quiz]
      summary: Submit a quiz answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuizAttemptInput"
      responses:
        "201":
          description: Attempt recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuizAttempt"

  /quiz/stats:
    get:
      operationId: getQuizStats
      tags: [quiz]
      summary: Get quiz statistics per subject
      parameters:
        - name: examCode
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Quiz stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuizSubjectStat"

  /quiz/generate-mcq:
    post:
      operationId: generateMcqFromNews
      tags: [quiz]
      summary: Generate MCQs from a news item using Gemini
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/McqGenerateInput"
      responses:
        "200":
          description: Generated MCQs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedMcq"

  /progress/summary:
    get:
      operationId: getProgressSummary
      tags: [progress]
      summary: Get overall progress summary
      responses:
        "200":
          description: Progress summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProgressSummary"

  /progress/weak-areas:
    get:
      operationId: getWeakAreas
      tags: [progress]
      summary: Get list of weak topic areas (below 60% accuracy)
      responses:
        "200":
          description: Weak areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WeakArea"

  /progress/daily-hours:
    get:
      operationId: getDailyStudyHours
      tags: [progress]
      summary: Get daily study hours for last N days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Daily hours data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyHoursEntry"

  /progress/heatmap:
    get:
      operationId: getStudyHeatmap
      tags: [progress]
      summary: Get last 30 days of study activity for a calendar heatmap
      responses:
        "200":
          description: Heatmap data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HeatmapDay"

  /admin/question-bank:
    get:
      operationId: adminListQuestionBank
      tags: [admin]
      summary: List question bank (paginated, filterable)
      parameters:
        - name: examCode
          in: query
          schema: { type: string }
        - name: subjectCode
          in: query
          schema: { type: string }
        - name: topicCode
          in: query
          schema: { type: string }
        - name: source
          in: query
          schema: { type: string }
        - name: language
          in: query
          schema: { type: string }
        - name: difficulty
          in: query
          schema: { type: string }
        - name: active
          in: query
          schema: { type: boolean }
        - name: page
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Paginated question list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankListResponse"
    post:
      operationId: adminCreateQuestion
      tags: [admin]
      summary: Create a single question in the bank
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankCreateInput"
      responses:
        "201":
          description: Created question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankItem"

  /admin/question-bank/stats:
    get:
      operationId: adminQuestionBankStats
      tags: [admin]
      summary: Question counts grouped by exam, subject, topic, source, language
      responses:
        "200":
          description: Stats breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /admin/question-bank/import/json:
    post:
      operationId: adminImportQuestionsJson
      tags: [admin]
      summary: Bulk import questions from a JSON array
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankJsonImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankImportResult"

  /admin/question-bank/import/csv:
    post:
      operationId: adminImportQuestionsCsv
      tags: [admin]
      summary: Bulk import questions from CSV (text/plain body or JSON { csv })
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankCsvImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankImportResult"

  /admin/question-bank/import/bulk:
    post:
      operationId: adminImportQuestionsBulk
      tags: [admin]
      summary: Bulk import with options (skipErrors, dryRun)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankBulkImportInput"
      responses:
        "201":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankImportResult"

  /admin/question-bank/{id}:
    put:
      operationId: adminUpdateQuestion
      tags: [admin]
      summary: Update a question (partial update supported)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionBankCreateInput"
      responses:
        "200":
          description: Updated question
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionBankItem"
    delete:
      operationId: adminDeleteQuestion
      tags: [admin]
      summary: Soft-delete a question (sets is_active = false)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    Profile:
      type: object
      properties:
        id:
          type: string
        clerkUserId:
          type: string
        fullName:
          type: ["string", "null"]
        phoneNumber:
          type: ["string", "null"]
        examType:
          type: ["string", "null"]
        examDate:
          type: ["string", "null"]
        dailyStudyHours:
          type: integer
        planType:
          type: string
        streakCount:
          type: integer
        longestStreak:
          type: integer
        lastActiveDate:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, clerkUserId, dailyStudyHours, planType, streakCount, longestStreak]

    ProfileInput:
      type: object
      properties:
        fullName:
          type: string
        phoneNumber:
          type: string
        examType:
          type: string
        examDate:
          type: string
        dailyStudyHours:
          type: integer

    StudyPlan:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        examType:
          type: ["string", "null"]
        planData:
          type: object
        weeksRemaining:
          type: ["integer", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, userId]

    DailyTask:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        date:
          type: string
        subject:
          type: ["string", "null"]
        topic:
          type: ["string", "null"]
        durationMinutes:
          type: ["integer", "null"]
        taskType:
          type: ["string", "null"]
        isCompleted:
          type: boolean
        completedAt:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
      required: [id, userId, date, isCompleted]

    SyllabusTopicWithProgress:
      type: object
      properties:
        id:
          type: string
        topicCode:
          type: ["string", "null"]
        name:
          type: string
        status:
          type: string
        lastRevisedAt:
          type: ["string", "null"]
      required: [id, name, status]

    SyllabusSubjectWithTopics:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        subjectCode:
          type: ["string", "null"]
        topics:
          type: array
          items:
            $ref: "#/components/schemas/SyllabusTopicWithProgress"
      required: [id, name, topics]

    SyllabusExamWithProgress:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        subjects:
          type: array
          items:
            $ref: "#/components/schemas/SyllabusSubjectWithTopics"
      required: [id, name, code, subjects]

    TopicProgressUpdate:
      type: object
      properties:
        status:
          type: string
      required: [status]

    TopicProgressResult:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        topicId:
          type: string
        status:
          type: string
        lastRevisedAt:
          type: ["string", "null"]
      required: [id, userId, topicId, status]

    CurrentAffairsArticle:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        summary:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        examRelevance:
          type: array
          items:
            type: string
        publishedDate:
          type: ["string", "null"]
        source:
          type: ["string", "null"]
        isFeatured:
          type: boolean
        createdAt:
          type: string
      required: [id, title, isFeatured]

    QuizQuestion:
      type: object
      properties:
        id:
          type: string
        examCode:
          type: ["string", "null"]
        subjectCode:
          type: ["string", "null"]
        topicCode:
          type: ["string", "null"]
        subject:
          type: ["string", "null"]
        topic:
          type: ["string", "null"]
        questionText:
          type: string
        options:
          type: object
        correctOption:
          type: ["string", "null"]
        explanation:
          type: ["string", "null"]
        difficulty:
          type: ["string", "null"]
        examType:
          type: array
          items:
            type: string
        createdAt:
          type: string
      required: [id, questionText]

    QuizAttemptInput:
      type: object
      properties:
        questionId:
          type: string
        selectedOption:
          type: string
        timeTakenSeconds:
          type: integer
      required: [questionId, selectedOption]

    QuizAttempt:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        questionId:
          type: string
        selectedOption:
          type: ["string", "null"]
        isCorrect:
          type: ["boolean", "null"]
        timeTakenSeconds:
          type: ["integer", "null"]
        attemptedAt:
          type: string
      required: [id, userId, questionId]

    QuizSubjectStat:
      type: object
      properties:
        subject:
          type: string
        subjectCode:
          type: ["string", "null"]
        totalQuestions:
          type: integer
        correct:
          type: integer
        accuracy:
          type: number
        lastPracticed:
          type: ["string", "null"]
        questionsAvailable:
          type: integer
      required: [subject, totalQuestions, correct, accuracy]

    McqGenerateInput:
      type: object
      properties:
        newsTitle:
          type: string
        newsSummary:
          type: string
      required: [newsTitle, newsSummary]

    GeneratedMcq:
      type: object
      properties:
        question:
          type: string
        options:
          type: object
        correct:
          type: string
        explanation:
          type: string
      required: [question, options, correct, explanation]

    ProgressSummary:
      type: object
      properties:
        streakCount:
          type: integer
        longestStreak:
          type: integer
        totalTasksCompleted:
          type: integer
        syllabusCompletionPercent:
          type: number
        avgQuizAccuracy:
          type: number
        studyHoursThisWeek:
          type: number
        studyHoursThisMonth:
          type: number
        totalStudyHours:
          type: number
        topicsCompletedThisMonth:
          type: integer
      required: [streakCount, longestStreak, totalTasksCompleted, syllabusCompletionPercent, avgQuizAccuracy, studyHoursThisWeek, studyHoursThisMonth, totalStudyHours, topicsCompletedThisMonth]

    HeatmapDay:
      type: object
      properties:
        date:
          type: string
        studied:
          type: boolean
        tasksCompleted:
          type: integer
        hoursStudied:
          type: number
      required: [date, studied, tasksCompleted, hoursStudied]

    WeakArea:
      type: object
      properties:
        topicCode:
          type: string
        topicName:
          type: string
        subjectCode:
          type: string
        subjectName:
          type: string
        examCode:
          type: string
        accuracy:
          type: number
        attempts:
          type: integer
      required: [topicCode, topicName, subjectCode, subjectName, examCode, accuracy, attempts]

    DailyHoursEntry:
      type: object
      properties:
        date:
          type: string
        hours:
          type: number
      required: [date, hours]

    QuestionBankItem:
      type: object
      properties:
        id:
          type: string
        examCode:
          type: string
        subjectCode:
          type: string
        topicCode:
          type: string
        difficulty:
          type: string
        question:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        optionC:
          type: string
        optionD:
          type: string
        correctAnswer:
          type: string
        explanation:
          type: ["string", "null"]
        source:
          type: string
        examYear:
          type: ["integer", "null"]
        language:
          type: string
        tags:
          type: array
          items:
            type: string
        isActive:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required: [id, examCode, subjectCode, topicCode, difficulty, question, optionA, optionB, optionC, optionD, correctAnswer, source, language, isActive]

    QuestionBankCreateInput:
      type: object
      properties:
        examCode:
          type: string
        subjectCode:
          type: string
        topicCode:
          type: string
        difficulty:
          type: string
          enum: [easy, medium, hard]
        question:
          type: string
        optionA:
          type: string
        optionB:
          type: string
        optionC:
          type: string
        optionD:
          type: string
        correctAnswer:
          type: string
          enum: [a, b, c, d]
        explanation:
          type: string
        source:
          type: string
          enum: [pyq, original, ai_generated]
        examYear:
          type: integer
        language:
          type: string
          enum: [english, hindi]
        tags:
          type: array
          items:
            type: string
      required: [examCode, subjectCode, topicCode, question, optionA, optionB, optionC, optionD, correctAnswer]

    QuestionBankListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBankItem"
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            pages:
              type: integer
          required: [page, limit, total, pages]
      required: [data, pagination]

    QuestionBankImportResult:
      type: object
      properties:
        inserted:
          type: integer
        skipped:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              index:
                type: integer
              error:
                type: string
        dryRun:
          type: boolean
      required: [inserted, skipped, errors, dryRun]

    QuestionBankJsonImportInput:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBankCreateInput"
      required: [questions]

    QuestionBankCsvImportInput:
      type: object
      properties:
        csv:
          type: string
          description: Raw CSV text with header row
      required: [csv]

    QuestionBankBulkImportInput:
      type: object
      properties:
        questions:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBankCreateInput"
        options:
          type: object
          properties:
            skipErrors:
              type: boolean
            dryRun:
              type: boolean
      required: [questions]
